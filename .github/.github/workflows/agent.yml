
name: AS Agent Automation

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6,12,18 * * *'

permissions:
  contents: write

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run agent
        run: python agent.py
      - name: Save reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Update AS agent reports"
            git push
          fi
